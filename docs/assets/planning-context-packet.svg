<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Planning context packet</title>
  <desc id="desc">Diagram showing prompt to retrieval to reasoning to planning context packet and its sections.</desc>
  <style>
    .bg { fill: #f8fafc; }
    .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 16; ry: 16; }
    .primary { fill: #dbeafe; stroke: #2563eb; }
    .green { fill: #dcfce7; stroke: #16a34a; }
    .amber { fill: #fef3c7; stroke: #d97706; }
    .violet { fill: #ede9fe; stroke: #7c3aed; }
    .slate { fill: #e2e8f0; stroke: #475569; }
    .title { font: 700 34px Inter, Arial, sans-serif; fill: #0f172a; }
    .label { font: 700 24px Inter, Arial, sans-serif; fill: #0f172a; }
    .text { font: 500 16px Inter, Arial, sans-serif; fill: #334155; }
    .line { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="bg" width="1400" height="820"/>
  <text class="title" x="60" y="60">Canonical Planning Context Packet</text>

  <rect class="card slate" x="60" y="120" width="180" height="80"/>
  <text class="label" x="105" y="168">Prompt</text>

  <rect class="card slate" x="300" y="120" width="220" height="80"/>
  <text class="label" x="340" y="168">Retrieval Intent</text>

  <rect class="card slate" x="580" y="120" width="220" height="80"/>
  <text class="label" x="620" y="168">Retrieval Dossier</text>

  <rect class="card slate" x="860" y="120" width="220" height="80"/>
  <text class="label" x="902" y="168">Reasoning Brief</text>

  <rect class="card primary" x="1130" y="90" width="220" height="140"/>
  <text class="label" x="1150" y="150">Planning Packet</text>
  <text class="text" x="1150" y="180">canonical provider-bound</text>
  <text class="text" x="1150" y="202">planning contract</text>

  <line class="line" x1="240" y1="160" x2="298" y2="160"/>
  <line class="line" x1="520" y1="160" x2="578" y2="160"/>
  <line class="line" x1="800" y1="160" x2="858" y2="160"/>
  <line class="line" x1="1080" y1="160" x2="1128" y2="160"/>

  <rect class="card green" x="120" y="320" width="260" height="90"/>
  <text class="label" x="160" y="370">task-frame</text>
  <text class="text" x="160" y="396">requested work, deliverable, phase</text>

  <rect class="card amber" x="430" y="320" width="260" height="90"/>
  <text class="label" x="462" y="370">planner-directives</text>
  <text class="text" x="462" y="396">precedence, escalation, posture</text>

  <rect class="card primary" x="740" y="300" width="540" height="130"/>
  <text class="label" x="770" y="352">authority-state</text>
  <text class="text" x="770" y="382">agent-constitution, capability-inventory,</text>
  <text class="text" x="770" y="406">project context, thread/turn, environment summary, Context Chat targeting</text>

  <rect class="card green" x="120" y="500" width="300" height="110"/>
  <text class="label" x="152" y="550">decisive-evidence</text>
  <text class="text" x="152" y="578">blockers, incidents, validations,</text>
  <text class="text" x="152" y="600">mutation consequences, project constraints</text>

  <rect class="card amber" x="470" y="500" width="300" height="110"/>
  <text class="label" x="498" y="550">uncertainty-and-obligations</text>
  <text class="text" x="498" y="578">missing authority, conflicts, stale context,</text>
  <text class="text" x="498" y="600">inspection obligations, ambiguity</text>

  <rect class="card violet" x="820" y="500" width="250" height="110"/>
  <text class="label" x="856" y="550">strategy</text>
  <text class="text" x="856" y="578">archetype, risk posture,</text>
  <text class="text" x="856" y="600">validation and execution bias</text>

  <rect class="card slate" x="1120" y="500" width="220" height="110"/>
  <text class="label" x="1148" y="550">optional-support</text>
  <text class="text" x="1148" y="578">secondary summaries</text>
  <text class="text" x="1148" y="600">and supporting context</text>

  <line class="line" x1="1240" y1="230" x2="250" y2="318"/>
  <line class="line" x1="1240" y1="230" x2="560" y2="318"/>
  <line class="line" x1="1240" y1="230" x2="1010" y2="298"/>
  <line class="line" x1="1240" y1="230" x2="270" y2="498"/>
  <line class="line" x1="1240" y1="230" x2="620" y2="498"/>
  <line class="line" x1="1240" y1="230" x2="945" y2="498"/>
  <line class="line" x1="1240" y1="230" x2="1230" y2="498"/>
</svg>
